<header
  *ngIf="showHeader"
  class="bg-white transition-all duration-500 ease-in-out text-gray-600 body-font sticky top-0 z-50 shadow-md dark:bg-gray-950 dark:text-gray-100 dark:shadow-inner"
>
  <div class="container mx-auto flex flex-wrap p-5 flex-col md:flex-row items-center justify-between">
    
    <!-- Logo + Burger -->
    <div class="flex justify-between w-full md:w-auto items-center">
      <a class="flex title-font font-medium text-gray-950 items-center" routerLink="/">
        <div class="flex flex-col ml-3">
          <h1 class="text-lg font-bold text-cyan-700 dark:text-cyan-400">Abdennadher Yessine</h1>
        </div>
      </a>

      <!-- Burger -->
      <button
        class="md:hidden text-gray-700 dark:text-gray-200 focus:outline-none"
        (click)="menuOpen = !menuOpen"
      >
        <svg *ngIf="!menuOpen" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
             viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
        <svg *ngIf="menuOpen" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
             viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Navigation + Dark Mode + Langue -->
    <div
      [ngClass]="{
        'flex': menuOpen,
        'hidden': !menuOpen
      }"
      class="flex-col md:flex md:flex-row md:flex-center md:items-center md:space-x-5 mt-4 md:mt-0 text-center w-full md:w-auto"
    >
      <nav class="flex flex-col md:flex-row md:space-x-5">
        <a (click)="scrollToSection('about'); menuOpen=false" class="py-2 font-medium dark:text-gray-300 hover:text-sky-800 dark:hover:text-sky-400 cursor-pointer">{{ 'ABOUT' | translate }}</a>
        <a (click)="scrollToSection('education'); menuOpen=false" class="py-2 font-medium dark:text-gray-300 hover:text-sky-800 dark:hover:text-sky-400 cursor-pointer">{{ 'EDUCATION' | translate }}</a>
        <a (click)="scrollToSection('experience'); menuOpen=false" class="py-2 font-medium dark:text-gray-300 hover:text-sky-800 dark:hover:text-sky-400 cursor-pointer">{{ 'EXPERIENCE' | translate }}</a>
        <a (click)="scrollToSection('skills'); menuOpen=false" class="py-2 font-medium dark:text-gray-300 hover:text-sky-800 dark:hover:text-sky-400 cursor-pointer">{{ 'SKILLS' | translate }}</a>
        <a (click)="scrollToSection('projects'); menuOpen=false" class="py-2 font-medium dark:text-gray-300 hover:text-sky-800 dark:hover:text-sky-400 cursor-pointer">{{ 'PROJECTS' | translate }}</a>
        <a (click)="scrollToSection('certifications'); menuOpen=false" class="py-2 font-medium dark:text-gray-300 hover:text-sky-800 dark:hover:text-sky-400 cursor-pointer">{{ 'CERTIFICATIONS' | translate }}</a>
      </nav>

      <!-- Section Langue + Dark mode -->
      <div class="flex flex-col md:flex-row items-center justify-center space-y-3 md:space-y-0 md:space-x-4 mt-4 md:mt-0">
        <!-- Dark mode -->
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" class="sr-only peer" (change)="toggleDarkMode()" [checked]="isDarkMode" />
          <div class="w-14 h-8 bg-gray-300 rounded-full peer-checked:bg-gray-700 transition-colors relative">
            <div class="w-6 h-6 bg-white rounded-full shadow-md flex items-center justify-center absolute top-1 left-1 transition-transform duration-300 peer-checked:translate-x-8">
              <svg *ngIf="!isDarkMode" class="w-4 h-4 text-yellow-400" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
                <path fill-rule="evenodd" d="M13 3a1 1 0 1 0-2 0v2a1 1 0 1 0 2 0V3ZM6.343 4.929A1 1 0 0 0 4.93 6.343l1.414 1.414a1 1 0 0 0 1.414-1.414L6.343 4.929Zm12.728 1.414a1 1 0 0 0-1.414-1.414l-1.414 1.414a1 1 0 0 0 1.414 1.414l1.414-1.414ZM12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm-9 4a1 1 0 1 0 0 2h2a1 1 0 1 0 0-2H3Zm16 0a1 1 0 1 0 0 2h2a1 1 0 1 0 0-2h-2ZM7.757 17.657a1 1 0 1 0-1.414-1.414l-1.414 1.414a1 1 0 1 0 1.414 1.414l1.414-1.414Zm9.9-1.414a1 1 0 0 0-1.414 1.414l1.414 1.414a1 1 0 0 0 1.414-1.414l-1.414-1.414ZM13 19a1 1 0 1 0-2 0v2a1 1 0 1 0 2 0v-2Z" clip-rule="evenodd"/>
              </svg>
              <svg *ngIf="isDarkMode" class="w-4 h-4 text-yellow-200" fill="currentColor" viewBox="0 0 20 20">
                <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
              </svg>
            </div>
          </div>
        </label>

        <!-- Langue -->
        <select
          [(ngModel)]="selectedLang"
          (change)="changeLanguage(selectedLang)"
          class="bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-200 border rounded-md p-1 focus:outline-none"
        >
          <option value="fr">FR</option>
          <option value="en">EN</option>
        </select>
      </div>
    </div>
  </div>
</header>
